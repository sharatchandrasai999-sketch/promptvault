[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "promptvault"
version = "0.1.0"
description = "Version prompts on disk and A/B test them with a deterministic mock LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sharat Chandra Sai Boddu" }]
dependencies = []

[project.scripts]
promptvault = "promptvault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
